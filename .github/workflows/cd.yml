name: Deploy to Firebase (CD)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build and Deploy to Firebase
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build Application
        run: yarn build

      - name: Install Functions dependencies
        working-directory: functions
        run: npm ci

      - name: Build Functions
        working-directory: functions
        run: npm run build

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_CLINICCARE_APP_LM }}'
          channelId: live
          projectId: cliniccare-app-lm

      - name: Write service account credentials
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_CLINICCARE_APP_LM }}' > /tmp/sa.json

      - name: Deploy Cloud Functions
        run: npx firebase-tools deploy --only functions --project cliniccare-app-lm
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/sa.json
